name: lot19-diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-signature-suffix-winps:
    runs-on: windows-latest
    steps:
      - name: Compare WinPS Authenticode with atomic temp suffix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/Git-2.55.0.5-64-bit.exe"
          $bad = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.exe.partial"
          $good = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.partial.exe"
          Invoke-WebRequest -Uri $url -OutFile $bad
          Copy-Item $bad $good
          & powershell.exe -NoProfile -NonInteractive -Command "Write-Output ('BAD_WINPS=' + (Get-AuthenticodeSignature -LiteralPath '$bad').Status.ToString()); Write-Output ('GOOD_WINPS=' + (Get-AuthenticodeSignature -LiteralPath '$good').Status.ToString())"
          if ($LASTEXITCODE -ne 0) { throw "WinPS diagnostic failed" }
