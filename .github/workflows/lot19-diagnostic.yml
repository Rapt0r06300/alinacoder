name: lot19-diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-signature:
    runs-on: windows-latest
    steps:
      - name: Compare Authenticode suffix handling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/Git-2.55.0.5-64-bit.exe"
          $bad = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.exe.partial"
          $good = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.partial.exe"
          Invoke-WebRequest -Uri $url -OutFile $bad
          Copy-Item $bad $good
          $badSig = Get-AuthenticodeSignature -LiteralPath $bad
          $goodSig = Get-AuthenticodeSignature -LiteralPath $good
          Write-Host "BAD_SUFFIX_STATUS=$($badSig.Status)"
          Write-Host "BAD_SUFFIX_SUBJECT=$($badSig.SignerCertificate.Subject)"
          Write-Host "GOOD_SUFFIX_STATUS=$($goodSig.Status)"
          Write-Host "GOOD_SUFFIX_SUBJECT=$($goodSig.SignerCertificate.Subject)"
          if ($goodSig.Status -ne "Valid") { throw "control .exe signature is not valid" }
