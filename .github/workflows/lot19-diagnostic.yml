name: lot19-diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-signature-runtime:
    runs-on: windows-latest
    steps:
      - name: Compare PowerShell runtimes for Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/Git-2.55.0.5-64-bit.exe"
          $file = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.exe"
          Invoke-WebRequest -Uri $url -OutFile $file
          Write-Host "PWSH_STATUS=$((Get-AuthenticodeSignature -LiteralPath $file).Status.ToString())"
          & powershell.exe -NoProfile -NonInteractive -Command "`$s=(Get-AuthenticodeSignature -LiteralPath '$file'); Write-Output ('WINPS_STATUS=' + `$s.Status.ToString()); Write-Output ('WINPS_SUBJECT=' + `$s.SignerCertificate.Subject); exit 0"
          Write-Host "WINPS_EXIT=$LASTEXITCODE"
