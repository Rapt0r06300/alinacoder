name: lot19-diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-official-installer-trust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify exact Git installer with native WinTrust
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $url = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/Git-2.55.0.5-64-bit.exe"
          $file = Join-Path $env:RUNNER_TEMP "Git-2.55.0.5-64-bit.exe"
          Invoke-WebRequest -Uri $url -OutFile $file
          $env:LOT19_SIGNED_FILE = $file
          @'
          import os
          from pathlib import Path
          from alinacoder.product.prerequisites import PrerequisiteManifest, WindowsBootstrapAdapter
          path = Path(os.environ['LOT19_SIGNED_FILE'])
          manifest = PrerequisiteManifest.load(Path('packaging/prerequisites-v0.2.json'))
          adapter = WindowsBootstrapAdapter(Path(os.environ['RUNNER_TEMP'])/'lot19-official-trust', manifest)
          print('ADAPTER_CLASS', adapter.__class__.__module__, adapter.__class__.__name__)
          print('OFFICIAL_GIT_TRUST', adapter.verify_authenticode(path))
          if not adapter.verify_authenticode(path):
              raise SystemExit(2)
          '@ | python -
          Write-Host "PWSH_STATUS=$((Get-AuthenticodeSignature -LiteralPath $file).Status.ToString())"
