name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate canonical spec
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m alinacoder.cli spec-compile --root .
  package-windows:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packager
        shell: pwsh
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executables
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python scripts/build_windows.py
      - name: Generate provenance and SBOM
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python scripts/generate_release_metadata.py
      - name: Smoke packaged application
        shell: pwsh
        run: .\dist\AlinaCoder.exe --self-test
      - name: Install, run, uninstall on clean temp destination
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "AlinaCoder-RC"
          .\dist\AlinaCoderSetup.exe --quiet --install-dir $dest
          & (Join-Path $dest "AlinaCoder.exe") --self-test
          .\dist\AlinaCoderSetup.exe --uninstall --quiet --install-dir $dest
          if (Test-Path (Join-Path $dest "AlinaCoder.exe")) { throw "uninstall left executable behind" }
      - name: Verify release bundle provenance
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python scripts/verify_release.py --dist dist --commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: AlinaCoder-v0.2-rc-${{ github.sha }}
          path: |
            dist/AlinaCoder.exe
            dist/AlinaCoderSetup.exe
            dist/release-manifest.json
            dist/sbom.spdx.json
            dist/USER_GUIDE.md
            dist/OPERATIONS.md
          if-no-files-found: error
